<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Status: Astro Profile - あなたのトリセツ</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->

    <style>
        body {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .pixel-font {
            font-family: 'DotGothic16', sans-serif;
        }
        /* Custom Gaming/Sci-Fi Border Glow */
        .status-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .status-card:hover {
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* Print Optimization Styles */
        @media print {
            body {
                background-color: #ffffff !important;
                color: #000000 !important;
            }
            header, #input-section, .no-print {
                display: none !important;
            }
            .status-card {
                background: #ffffff !important;
                border: 1px solid #cbd5e1 !important;
                box-shadow: none !important;
                color: #0f172a !important;
                break-inside: avoid;
                margin-bottom: 16px;
            }
            * {
                color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
            h1, h2, h3, h4, span, p {
                color: #1e293b !important;
            }
            .bg-slate-900, .bg-slate-900\/60, .bg-slate-900\/50, .bg-slate-900\/40 {
                background-color: #f8fafc !important;
                border: 1px solid #e2e8f0 !important;

<body class="min-h-screen pb-12">

                </div>
                <div>

                <span class="text-xs text-slate-400">※各天体の星座を選択するか、誕生日入力で自動推定できます</span>
            </div>

            <!-- Profile Info Input -->

                    <label class="block text-xs font-semibold text-slate-400 mb-1">プレイヤー名 (名前)</label>

                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">生年月日 (星座推定用)</label>
                    <input type="date" id="birth-date" value="2000-01-01" onchange="autoCalculateSigns()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                            <span>時間不明 (12:00で計算)</span>
                        </label>

        function getEstimatedSunSign(month, day) {
            const dates = [
                { sign: "山羊座", end: 19 }, { sign: "水瓶座", end: 18 },
                { sign: "魚座", end: 20 }, { sign: "牡羊座", end: 19 },
                { sign: "牡牛座", end: 20 }, { sign: "双子座", end: 21 },
                { sign: "蟹座", end: 22 }, { sign: "獅子座", end: 22 },
                { sign: "乙女座", end: 22 }, { sign: "天秤座", end: 23 },
                { sign: "蠍座", end: 21 }, { sign: "射手座", end: 21 },
                { sign: "山羊座", end: 31 }
            ];
            return day <= dates[month - 1].end ? dates[month - 1].sign : dates[(month % 12)].sign;
        }

        function downloadTextFile() {
            const text = generateExportText();
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${userState.name || '冒険者'}_パーソナル・トリセツ.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function alertCustom(msg) {
            // Friendly custom notification toast
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-6 right-6 z-50 bg-indigo-600 text-white px-4 py-3 rounded-xl shadow-2xl text-xs font-bold transition-all duration-300 flex items-center gap-2';
            toast.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4"></i> ${msg}`;
            document.body.appendChild(toast);
            if (window.lucide) lucide.createIcons();
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function updateSingleSign(planetKey, signValue) {
            userState.signs[planetKey] = signValue;
            
            if (planetKey === "dragonhead") {
                const headIndex = ZODIAC_SIGNS.indexOf(signValue);

        function autoCalculateSigns() {
            const dateVal = document.getElementById("birth-date").value;
            const timeVal = document.getElementById("birth-time").value;
            if (!dateVal) return;

            userState.birthDate = dateVal;
            userState.birthTime = timeVal;

            const [year, month, day] = dateVal.split("-").map(Number);
            const [hours, minutes] = (timeVal || "12:00").split(":").map(Number);
            
            const jstDate = new Date(Date.UTC(year, month - 1, day, hours - 9, minutes));
            const d = (jstDate.getTime() - Date.UTC(2000, 0, 1, 12, 0, 0)) / 86400000.0;

            const rad = Math.PI / 180;
            const norm = (deg) => (deg % 360 + 360) % 360;
            const getSign = (lon) => ZODIAC_SIGNS[Math.floor(norm(lon) / 30)];

            const sunMeanAnomaly = norm(357.529 + 0.98560028 * d);
            const sunMeanLon = norm(280.459 + 0.98564736 * d);
            const sunTrueLon = norm(sunMeanLon + 1.915 * Math.sin(sunMeanAnomaly * rad) + 0.020 * Math.sin(2 * sunMeanAnomaly * rad));

            const moonL = norm(218.316 + 13.176396 * d);
            const moonM = norm(134.963 + 13.064993 * d);
            const moonF = norm(93.272 + 13.229350 * d);
            const moonD = norm(297.850 + 12.190749 * d);
            const moonTrueLon = norm(moonL 
                + 6.289 * Math.sin(moonM * rad) 
                - 1.274 * Math.sin((moonM - 2 * moonD) * rad)
                + 0.658 * Math.sin(2 * moonD * rad)
                - 0.214 * Math.sin(2 * moonM * rad)
                - 0.186 * Math.sin(sunMeanAnomaly * rad)
                + 0.114 * Math.sin(2 * moonF * rad));

            function getPlanetGeocentricLon(N0, N_rate, i0, w0, w_rate, a0, e0, M0, M_rate) {
                const M = norm(M0 + M_rate * d);
                const E = M + (e0 * 180 / Math.PI) * Math.sin(M * rad) * (1 + e0 * Math.cos(M * rad));
                const xv = a0 * (Math.cos(E * rad) - e0);
                const yv = a0 * Math.sqrt(1.0 - e0 * e0) * Math.sin(E * rad);
                const v = norm(Math.atan2(yv, xv) / rad);
                const r = Math.sqrt(xv * xv + yv * yv);
                
                const N = norm(N0 + N_rate * d);
                const w = norm(w0 + w_rate * d);
                const u = norm(v + w);
                const xh = r * (Math.cos(N * rad) * Math.cos(u * rad) - Math.sin(N * rad) * Math.sin(u * rad) * Math.cos(i0 * rad));
                const yh = r * (Math.sin(N * rad) * Math.cos(u * rad) + Math.cos(N * rad) * Math.sin(u * rad) * Math.cos(i0 * rad));

                const R_earth = 1.000001018 * (1 - 0.0167086 * Math.cos(sunMeanAnomaly * rad));
                const x_earth = R_earth * Math.cos(sunTrueLon * rad);
                const y_earth = R_earth * Math.sin(sunTrueLon * rad);

                const xg = xh + x_earth;
                const yg = yh + y_earth;

                return norm(Math.atan2(yg, xg) / rad);
            }

            const mercuryLon = getPlanetGeocentricLon(48.331, 3.2458e-5, 7.005, 29.124, 1.0144e-5, 0.387098, 0.205630, 174.796, 4.0923344);
            const venusLon = getPlanetGeocentricLon(76.680, 2.4659e-5, 3.394, 54.884, 1.3837e-5, 0.723330, 0.006773, 50.115, 1.6021302);
            const marsLon = getPlanetGeocentricLon(49.558, 2.1108e-5, 1.850, 286.502, 2.9296e-5, 1.523679, 0.093401, 19.373, 0.5240208);
            const jupiterLon = getPlanetGeocentricLon(100.464, 1.807e-5, 1.303, 273.867, 1.645e-5, 5.20260, 0.048498, 20.020, 0.0830853);
            const saturnLon = getPlanetGeocentricLon(113.666, 2.389e-5, 2.489, 339.392, 2.976e-5, 9.55490, 0.055546, 317.020, 0.0334441);

            const headLon = norm(125.0445 - 0.0529538083 * d);

            userState.signs.sun = getSign(sunTrueLon);
            userState.signs.moon = getSign(moonTrueLon);
            userState.signs.mercury = getSign(mercuryLon);
            userState.signs.venus = getSign(venusLon);
            userState.signs.mars = getSign(marsLon);
            userState.signs.jupiter = getSign(jupiterLon);
            userState.signs.saturn = getSign(saturnLon);

            const dh = getSign(headLon);
            userState.signs.dragonhead = dh;
            
            const headIdx = ZODIAC_SIGNS.indexOf(dh);
            userState.signs.dragontail = ZODIAC_SIGNS[(headIdx + 6) % 12];

            renderPlanetSelectors();
            renderStatusBoard();
        }
